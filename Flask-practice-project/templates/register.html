<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NLP-App | Login Page</title>
</head>
<body>
    <h1>
        NLP APP
    </h1>

    <h3>
        Register Here! <br>
        {% if message %}
            <p style="color: red;">{{message}}</p>
        {% endif %}

        <form action="/perform_registration" method="post">
            <label for="">Name</label><br>
            <input type="text" name="users_name" required><br>
            <label for="">Email</label><br>
            <input type="email" name="users_email" required><br>
            <label for="">Password</label><br>
            <input type="password" name="users_password" required><br><br>
            <input type="submit" value="Register">
               </form>
    </h3>
    <p> Already a member? <a href="/">Login Here</a></p>
</body>
</html>
